title: Lampsonnos
GeneralInfo:
  Statistics:
    Type: City
    Region: Lanaroth
    Population: 32500
  Description: |-
    Originally a spiritual hub, Lampsonnos is renowned for the number and diversity of historical temples,
    particularly those of the Adherents of the Sacred Flame and the Ephonian Mysteries, though the latter
    are primarily of historical and archeological interest as they lay in ruins. The latter has attracted
    all manner of fortune-seekers, hoping to find hidden treasures from Aroth's prime. This has led to a
    closure of the ruins by the local Assembly, though this has not deterred the more criminally minded.
    
    The city Assembly is empowered to conduct the Trials of Absolution for its administrative district,
    owing both to the historical significance of the city as much as the suitability of the city's 
    infrastructure.
Geography:
  Description: >-
    The city is located along an ecotone, taking advantage of the abundant timber and open grassland.
